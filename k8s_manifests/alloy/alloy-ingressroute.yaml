apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
  name: alloy
  namespace: alloy-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`alloy.fahmed.org`)
      services:
        - name: my-alloy
          port: 12345
