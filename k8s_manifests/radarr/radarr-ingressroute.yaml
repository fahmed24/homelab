apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-ingressroute
  namespace: radarr-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`radarr.fahmed.org`)
      services:
        - name: my-radarr
          port: 7878
  tls:
    secretName: radarr-tls

