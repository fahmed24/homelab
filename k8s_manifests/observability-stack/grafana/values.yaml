image:
  tag: 12.4.0
env:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: grafana-secrets
        key: client-secret
admin:
  existingSecret: grafana-secrets
  userKey: user
  passwordKey: password
initChownData:
  enabled: true
persistence:
  enabled: true
grafana.ini:
  paths:
    data: /var/lib/grafana/
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  analytics:
    check_for_updates: true
  log:
    mode: console
  server:
    domain: "{{ if (and .Values.ingress.enabled .Values.ingress.hosts) }}{{ tpl (.Values.ingress.hosts | first) . }}{{ else if (and .Values.route.main.enabled .Values.route.main.hostnames) }}{{ tpl (.Values.route.main.hostnames | first) . }}{{ else }}''{{ end }}"
  unified_storage:
    index_path: /var/lib/grafana-search/bleve
  auth:
    generic_oauth:
      enabled: true
      name: Keycloak-OAuth
      allow_sign_up: false
      client_id: grafana
      scopes: "openid email profile offline_acces roles"
      email_attribute_path: email
      login_attribute_path: username
      name_attribute_path: full_name
      auth_url: https://auth.fahmed.org/realms/master/protocol/openid-connect/auth 
      token_url: https://auth.fahmed.org/realms/master/protocol/openid-connect/token 
      api_url: https://auth.fahmed.org/realms/master/protocol/openid-connect/userinfo
      role_attribute_path: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'"
