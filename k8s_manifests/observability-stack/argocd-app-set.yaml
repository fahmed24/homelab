# https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/#helm-value-files-from-external-git-repository
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-stack
  namespace: argo-cd-app
spec:
  generators:
  - list:
      elements:
      - app: alloy
        url: https://grafana.github.io/helm-charts
        chartRevision: 1.6.1
      - app: grafana
        url: https://grafana-community.github.io/helm-charts/
        chartRevision: 11.2.3
      - app: loki
        url: https://grafana.github.io/helm-charts
        chartRevision: 6.53.0
      - app: minio
        url: oci://registry-1.docker.io/cloudpirates/minio
        chartRevision: 0.10.1
      - app: prometheus
        url: https://prometheus-community.github.io/helm-charts
        chartRevision: 28.13.0
      - app: tempo
        url: https://prometheus-community.github.io/helm-charts
        chartRevision: 1.26.6
  template:
    metadata:
      name: '{{app}}'
    spec:
      project: default
      sources:
      - repoURL: '{{url}}'
        chart: '{{app}}'
        targetRevision: '{{chartRevision}}'
        helm:
          valueFiles:
          - '$values/k8s_manifests/observability-stack/{{app}}/values.yaml'
      - repoURL: https://github.com/fahmed24/homelab.git
        targetRevision: dev
        path: 'k8s_manifests/observability-stack/{{app}}'
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{app}}-app'
      syncPolicy:
        automated:
          prune: true    # Delete resources no longer in git
          selfHeal: true # Auto-sync if cluster state drifts from git
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5          # Maximum number of sync attempts before giving up
          backoff:
            duration: 5s    # Wait 5 seconds before first retry
            factor: 2       # Double the wait time after each retry (5s, 10s, 20s, 40s, 80s)
            maxDuration: 3m # Cap the wait time at 3 minutes between retries
      ignoreDifferences:
      - group: "*"
        kind: "*"
        jqPathExpressions:
        - '.metadata.annotations["argocd.argoproj.io/tracking-id"]'
