apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
  name: public-oauth2-proxy
  namespace: oauth2-proxy-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`public-oauth2.fahmed.org`) || PathPrefix(`/oauth2/`)
      middlewares:
        - name: auth-headers
          namespace: oauth2-proxy-app
      services:
        - name: public-oauth2-proxy
          port: 80
