apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  name: oauth2-proxy-sa
  namespace: oauth2-proxy-app
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  annotations: {}
  name: oauth2-proxy-vault-auth
  namespace: oauth2-proxy-app
spec:
  kubernetes:
    audiences:
      - vault
    role: oauth2-proxy-role
    serviceAccount: oauth2-proxy-sa
  method: kubernetes
  mount: kubernetes
