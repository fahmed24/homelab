apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: miniflux-static-secret
  namespace: miniflux-app
spec:
  destination:
    create: true
    name: miniflux-secrets
  mount: kv
  path: miniflux
  refreshAfter: 24h
  type: kv-v2
  vaultAuthRef: miniflux-auth
