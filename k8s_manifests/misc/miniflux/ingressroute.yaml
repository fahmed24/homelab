apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations: {}
  name: miniflux
  namespace: miniflux-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`miniflux.fahmed.org`)
      middlewares: null
      services:
        - name: miniflux
          port: 8080
  tls:
    secretName: miniflux-tls
