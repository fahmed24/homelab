apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: miniflux-certificate
  namespace: miniflux-app
spec:
  commonName: miniflux.fahmed.org
  dnsNames:
    - miniflux.fahmed.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare-prod
  renewBefore: 720h
  secretName: miniflux-tls
