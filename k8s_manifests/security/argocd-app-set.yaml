# https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/#helm-value-files-from-external-git-repository
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: security
  namespace: argo-cd-app
spec:
  generators:
  - list:
      elements:
      - app: cert-manager
        url: https://charts.jetstack.io
        chartRevision: 1.19.4
        namespaceSuffix: 'app'
      - app: keycloak
        url: oci://registry-1.docker.io/cloudpirates/keycloak
        namespaceSuffix: 'app'
      - app: oauth2-proxy
        url: https://oauth2-proxy.github.io/manifests
        chartRevision: 10.1.4
        namespaceSuffix: 'app'
      - app: vault-secrets-operator
        url: https://helm.releases.hashicorp.com
        chartRevision: 1.3.0
        namespaceSuffix: 'system'
      - app: vault
        url: https://helm.releases.hashicorp.com
        chartRevision: 0.32.0
        namespaceSuffix: 'app'
  template:
    metadata:
      name: '{{app}}'
    spec:
      project: default
      sources:
      - repoURL: '{{url}}'
        chart: '{{app}}'
        targetRevision: '{{chartRevision}}'
        helm:
          valueFiles:
          - '$values/k8s_manifests/security/{{app}}/values.yaml'
      - repoURL: https://github.com/fahmed24/homelab.git
        targetRevision: dev
        path: 'k8s_manifests/security/{{app}}'
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{app}}-{{namespaceSuffix}}'
      syncPolicy:
        automated:
          prune: true    # Delete resources no longer in git
          selfHeal: true # Auto-sync if cluster state drifts from git
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5          # Maximum number of sync attempts before giving up
          backoff:
            duration: 5s    # Wait 5 seconds before first retry
            factor: 2       # Double the wait time after each retry (5s, 10s, 20s, 40s, 80s)
            maxDuration: 3m # Cap the wait time at 3 minutes between retries
      ignoreDifferences:
      - group: "*"
        kind: "*"
        jqPathExpressions:
        - '.metadata.annotations["argocd.argoproj.io/tracking-id"]'
