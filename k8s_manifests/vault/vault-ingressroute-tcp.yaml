apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  annotations: {}
  name: vault-ingress-tcp
  namespace: vault-app
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`vault.fahmed.org`)
      services:
        - name: my-vault
          port: 8200
  tls:
    passthrough: true
