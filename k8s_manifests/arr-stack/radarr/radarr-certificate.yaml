apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: radarr-certificate
  namespace: radarr-app
spec:
  commonName: radarr.fahmed.org
  dnsNames:
    - radarr.fahmed.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare-prod
  renewBefore: 720h
  secretName: radarr-tls
