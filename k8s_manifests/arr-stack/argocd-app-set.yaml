# https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/#helm-value-files-from-external-git-repository
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: arr-stack
  namespace: argo-cd-app
spec:
  generators:
  - list:
      elements:
      - app: flaresolverr
        url: oci://ghcr.io/m0nsterrr/helm-charts/flaresolverr
        chartRevision: 2.4.0
      - app: jellyfin
        url: https://beluga-cloud.github.io/charts
        chartRevision: 2.3.0
      - app: prowlarr
        url: https://charts.pree.dev
        chartRevision: 1.50.1
      - app: radarr
        url: https://charts.pree.dev
        chartRevision: 1.26.0
      - app: qbittorrent-vpn
        url: https://bdclark.github.io/helm-charts
        chartRevision: 0.7.2
      - app: sonarr
        url: https://charts.pree.dev
        chartRevision: 1.12.1
  template:
    metadata:
      name: '{{app}}'
    spec:
      project: default
      sources:
      - repoURL: '{{url}}'
        chart: '{{app}}'
        targetRevision: '{{chartRevision}}'
        helm:
          valueFiles:
          - '$values/k8s_manifests/arr-stack/{{app}}/values.yaml'
      - repoURL: https://github.com/fahmed24/homelab.git
        targetRevision: dev
        path: 'k8s_manifests/arr-stack/{{app}}'
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{app}}-app'
      syncPolicy:
        automated:
          prune: true    # Delete resources no longer in git
          selfHeal: true # Auto-sync if cluster state drifts from git
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5          # Maximum number of sync attempts before giving up
          backoff:
            duration: 5s    # Wait 5 seconds before first retry
            factor: 2       # Double the wait time after each retry (5s, 10s, 20s, 40s, 80s)
            maxDuration: 3m # Cap the wait time at 3 minutes between retries
      ignoreDifferences:
      - group: "*"
        kind: "*"
        jqPathExpressions:
        - '.metadata.annotations["argocd.argoproj.io/tracking-id"]'
