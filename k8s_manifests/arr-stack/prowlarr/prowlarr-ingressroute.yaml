apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr-ingressroute
  namespace: prowlarr-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`prowlarr.fahmed.org`)
      services:
        - name: prowlarr
          port: 9696
  tls:
    secretName: prowlarr-tls

