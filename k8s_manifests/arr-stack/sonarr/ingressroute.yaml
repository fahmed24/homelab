apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-ingressroute
  namespace: sonarr-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`sonarr.fahmed.org`)
      services:
        - name: sonarr
          port: 8989
  tls:
    secretName: sonarr-tls

