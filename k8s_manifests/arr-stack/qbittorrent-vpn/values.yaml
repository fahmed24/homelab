qbittorrent:
  image:
    tag: 5.2.3
  env:
    TZ: America/Los_Angeles
  persistence:
    # Chart Values Ref:
    # https://github.com/bdclark/helm-charts/blob/main/charts/qbittorrent-vpn/templates/pvc.yaml
    data:
      enabled: true
      mountPath: /downloads
      existingClaim: cluster-storage-downloads-pvc

gluetun:
  image:
    tag: v3.41.3
  env:
    TZ: America/Los_Angeles
    VPN_SERVICE_PROVIDER: nordvpn
    VPN_TYPE: wireguard
    SERVER_COUNTRIES: United States
    # Method to obtain wireguard private key from NordVPN
    # https://gist.github.com/bluewalk/7b3db071c488c82c604baf76a42eaad3
    WIREGUARD_PRIVATE_KEY:
      valueFrom:
        secretKeyRef:
          key: wireguard-private-key
          name: wireguard-private-key
    # Constrains all containers to communicate only through VPN
    FIREWALL_OUTBOUND_SUBNETS: "10.5.0.0/24"
