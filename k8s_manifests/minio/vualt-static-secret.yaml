apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  annotations: {}
  name: minio-static-secret
  namespace: minio-app
spec:
  destination:
    create: true
    name: minio-secrets
  mount: kv
  path: minio
  refreshAfter: 24h
  type: kv-v2
  vaultAuthRef: minio-vault-auth
