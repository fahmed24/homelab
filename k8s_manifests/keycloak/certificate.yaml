apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: keycloak-certificate
  namespace: keycloak-app
spec:
  commonName: auth.fahmed.org
  dnsNames:
    - auth.fahmed.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare-prod
  renewBefore: 720h
  secretName: keycloak-tls
