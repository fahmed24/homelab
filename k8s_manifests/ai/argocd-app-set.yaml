# https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/#helm-value-files-from-external-git-repository
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ai
  namespace: argo-cd-app
spec:
  generators:
  - list:
      elements:
      - app: ollama
        url: https://helm.otwld.com/
        chartRevision: 1.48.0
        namespace: ollama-app
      - app: open-webui
        url: https://helm.openwebui.com/
        chartRevision: 12.8.1
        namespace: owu-app
  template:
    metadata:
      name: '{{app}}'
    spec:
      project: default
      sources:
      - repoURL: '{{url}}'
        chart: '{{app}}'
        targetRevision: '{{chartRevision}}'
        helm:
          valueFiles:
          - '$values/k8s_manifests/ai/{{app}}/values.yaml'
      - repoURL: https://github.com/fahmed24/homelab.git
        targetRevision: dev
        path: 'k8s_manifests/ai/{{app}}'
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true    # Delete resources no longer in git
          selfHeal: true # Auto-sync if cluster state drifts from git
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5          # Maximum number of sync attempts before giving up
          backoff:
            duration: 5s    # Wait 5 seconds before first retry
            factor: 2       # Double the wait time after each retry (5s, 10s, 20s, 40s, 80s)
            maxDuration: 3m # Cap the wait time at 3 minutes between retries
      ignoreDifferences:
      - group: "*"
        kind: "*"
        jqPathExpressions:
        - '.metadata.annotations["argocd.argoproj.io/tracking-id"]'
