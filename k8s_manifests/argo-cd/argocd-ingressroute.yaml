apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingressroute
  namespace: argo-cd-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.fahmed.org`)
      services:
        - name: my-argo-cd-argocd-server
          port: 80
  tls:
    secretName: argocd-tls

