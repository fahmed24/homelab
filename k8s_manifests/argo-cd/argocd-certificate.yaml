apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations: {}
  name: argocd-certificate
  namespace: argo-cd-app
spec:
  commonName: argocd.fahmed.org
  dnsNames:
    - argocd.fahmed.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare-prod
  renewBefore: 720h
  secretName: argocd-tls
