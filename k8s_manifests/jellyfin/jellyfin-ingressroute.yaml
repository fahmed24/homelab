apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-ingressroute
  namespace: jellyfin-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`jellyfin.fahmed.org`)
      services:
        - name: my-jellyfin
          port: 8096
  tls:
    secretName: jellyfin-tls

