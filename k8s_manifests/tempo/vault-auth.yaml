apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  name: tempo-sa
  namespace: tempo-app
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  annotations: {}
  name: tempo-vault-auth
  namespace: tempo-app
spec:
  kubernetes:
    audiences:
      - vault
    role: minio-role
    serviceAccount: tempo-sa
  method: kubernetes
  mount: kubernetes
