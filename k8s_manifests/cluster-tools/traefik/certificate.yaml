apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: dashboard-certificate
  namespace: kube-system
spec:
  commonName: traefik.fahmed.org
  dnsNames:
    - traefik.fahmed.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare-prod
  renewBefore: 720h
  secretName: traefik-tls
