apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations: {}
  name: prowlarr-certificate
  namespace: prowlarr-app
spec:
  commonName: prowlarr.fahmed.org
  dnsNames:
    - prowlarr.fahmed.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare-prod
  renewBefore: 720h
  secretName: prowlarr-tls
