---
- name: Bootstrap Non-Bastion host with ansible user
  hosts:
    - k3s_servers
    - k3s_agents
    - postgresql
  become: yes
  vars:
    ansible_user: default
    ansible_ssh_private_key_file: ~/.ssh/ansible
    ansible_ssh_common_args: '-o ProxyJump=bastion -o StrictHostKeyChecking=no'
    ansible_pubkey_path: ~/.ssh/ansible.pub
  roles:
    - bootstrap_user
    - qemu_guest_agent
