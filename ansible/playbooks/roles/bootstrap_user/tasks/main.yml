---
- name: Create ansible user
  user:
    name: ansible
    groups: sudo
    shell: /bin/bash
    create_home: yes

- name: Add SSH authorized key for ansible user
  authorized_key:
    user: ansible
    state: present
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/ansible_proxmox.pub') }}"

- name: Allow passwordless sudo for ansible
  copy:
    dest: /etc/sudoers.d/ansible
    content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
    mode: '0440'

# Disable root login in sshd_config
- name: Disable root SSH login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
    backup: yes

# Restart SSH service
- name: Restart SSH service
  service:
    name: sshd
    state: restarted
