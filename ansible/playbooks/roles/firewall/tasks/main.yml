# roles/firewall/tasks/main.yml
- name: Configure UFW allowed ports
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from_ip | default(omit) }}"
  loop: "{{ ufw_allowed_ports }}"

